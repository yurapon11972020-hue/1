<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение cookie</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }
        #message {
            text-align: center;
            font-size: 24px;
            z-index: 10;
            position: relative;
        }
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 20;
        }
        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div id="message">
        <h1>Нажмите в любое место, чтобы подтвердить файлы cookie</h1>
        <p>(Это необходимо для продолжения)</p>
    </div>
    <div id="video-container">
        <video id="scary-video" src="Jeffkillermp4.mp4" preload="auto" playsinline></video>
    </div>

    <script>
        document.body.addEventListener('click', function() {
            const container = document.getElementById('video-container');
            const video = document.getElementById('scary-video');
            
            container.style.display = 'block';
            
            video.play().catch(e => {
                console.error('Ошибка воспроизведения:', e);
                // Если видео не загрузилось, можно показать сообщение
                alert('Не удалось загрузить видео. Проверьте наличие файла Jeffkillermp4.mp4');
            });
            
            document.getElementById('message').style.display = 'none';
            
            // Удаляем обработчик, чтобы случайно не запустить видео повторно
            document.body.removeEventListener('click', arguments.callee);
        });
    </script>
</body>
</html>
