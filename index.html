<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение cookie</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }
        #message {
            text-align: center;
            font-size: 24px;
            z-index: 10;
            position: relative;
        }
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 20;
            background: black;
        }
        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #error-message {
            display: none;
            color: red;
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <div id="message">
        <h1>Нажмите в любое место, чтобы подтвердить файлы cookie</h1>
        <p>(Это необходимо для продолжения)</p>
    </div>
    <div id="video-container">
        <video id="scary-video" preload="auto" playsinline>
            <source src="Jeffkillermp4.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>
    <div id="error-message"></div>

    <script>
        const video = document.getElementById('scary-video');
        const container = document.getElementById('video-container');
        const message = document.getElementById('message');
        const errorDiv = document.getElementById('error-message');

        // Проверка загрузки видео
        video.addEventListener('error', function(e) {
            console.error('Ошибка загрузки видео:', video.error);
            let errorText = 'Не удалось загрузить видео. Проверьте:<br>' +
                           '- Файл должен называться точно <strong>Jeffkillermp4.mp4</strong> (с учётом регистра)<br>' +
                           '- Файл должен лежать в той же папке, что и index.html<br>' +
                           '- Видео должно быть в формате MP4 (H.264)';
            errorDiv.innerHTML = errorText;
            errorDiv.style.display = 'block';
        });

        // Успешная загрузка метаданных (видео готово)
        video.addEventListener('loadedmetadata', function() {
            console.log('Видео загружено, длительность:', video.duration);
        });

        // Обработка клика
        document.body.addEventListener('click', function onClick() {
            // Удаляем обработчик, чтобы повторный клик не ломал логику
            document.body.removeEventListener('click', onClick);

            // Скрываем сообщение
            message.style.display = 'none';

            // Показываем контейнер с видео
            container.style.display = 'block';

            // Пытаемся воспроизвести
            video.play().then(() => {
                console.log('Видео запущено');
            }).catch(err => {
                console.error('Ошибка воспроизведения:', err);
                errorDiv.innerHTML = 'Не удалось воспроизвести видео. Возможно, браузер блокирует автовоспроизведение. Попробуйте нажать ещё раз.';
                errorDiv.style.display = 'block';
            });
        });
    </script>
</body>
</html>
