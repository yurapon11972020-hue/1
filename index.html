<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Согласие на cookie</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .cookie-popup {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            text-align: center;
        }
        .cookie-popup h2 {
            margin-top: 0;
            color: #333;
        }
        .cookie-popup p {
            color: #666;
            line-height: 1.5;
        }
        /* Чёрный экран, который появляется после клика */
        .black-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 2000;
        }
        /* Если хотите добавить картинку вместо чёрного фона — раскомментируйте и укажите путь к изображению */
        /*
        .black-screen {
            background: black url('jeff.jpg') center/cover no-repeat;
        }
        */
    </style>
</head>
<body>

    <div class="overlay" id="cookieOverlay">
        <div class="cookie-popup">
            <h2>🍪 Мы используем файлы cookie</h2>
            <p>Продолжая использовать этот сайт, вы соглашаетесь на использование файлов cookie. Нажимая в любом месте экрана, вы подтверждаете свое согласие.</p>
            <p><small>(Это просто уведомление, кнопки не нужны)</small></p>
        </div>
    </div>

    <!-- Чёрный экран (или фон для скримера) -->
    <div class="black-screen" id="blackScreen"></div>

    <!-- Аудио элемент с предзагрузкой -->
    <audio id="scareAudio" preload="auto">
        <source src="JeffKiller.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>

    <script>
        let scareTriggered = false;

        function triggerScare() {
            if (scareTriggered) return;
            scareTriggered = true;

            // Скрываем уведомление
            document.getElementById('cookieOverlay').style.display = 'none';

            // Показываем чёрный экран
            document.getElementById('blackScreen').style.display = 'block';

            // Воспроизводим аудио с максимальной громкостью
            const audio = document.getElementById('scareAudio');
            audio.volume = 1.0; // 100% громкость
            audio.play().catch(error => {
                console.warn('Не удалось воспроизвести аудио:', error);
                // Если браузер заблокировал автовоспроизведение, можно показать сообщение
                alert('Нажмите ещё раз, чтобы активировать звук (из-за настроек браузера)');
            });
        }

        // Любой клик запускает скример
        document.addEventListener('click', triggerScare);
    </script>
</body>
</html>
