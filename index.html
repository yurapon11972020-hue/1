<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Согласие на cookie</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .cookie-popup {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            text-align: center;
        }
        .cookie-popup h2 {
            margin-top: 0;
            color: #333;
        }
        .cookie-popup p {
            color: #666;
            line-height: 1.5;
        }
        .video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            background-color: black;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Видео заполняет весь экран, обрезаясь если нужно */
        }
    </style>
</head>
<body>

    <div class="overlay" id="cookieOverlay">
        <div class="cookie-popup">
            <h2>🍪 Мы используем файлы cookie</h2>
            <p>Продолжая использовать этот сайт, вы соглашаетесь на использование файлов cookie. Нажимая в любом месте экрана, вы подтверждаете свое согласие.</p>
            <p><small>(Это просто уведомление, кнопки не нужны)</small></p>
        </div>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="scareVideo" preload="auto" playsinline webkit-playsinline>
            <source src="scare.mp4" type="video/mp4">
            <!-- Добавьте другие форматы для надёжности, например WebM -->
            <!-- <source src="scare.webm" type="video/webm"> -->
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <script>
        let scareTriggered = false;

        function triggerScare() {
            if (scareTriggered) return;
            scareTriggered = true;

            // Скрываем уведомление
            document.getElementById('cookieOverlay').style.display = 'none';

            // Показываем контейнер с видео
            const videoContainer = document.getElementById('videoContainer');
            videoContainer.style.display = 'block';

            // Получаем видео и запускаем
            const video = document.getElementById('scareVideo');
            video.volume = 1.0; // Максимальная громкость
            video.play().catch(error => {
                console.warn('Автовоспроизведение не удалось:', error);
                // Если не удалось, возможно, нужен ещё один клик
            });
        }

        // Любой клик запускает скример
        document.addEventListener('click', triggerScare);
    </script>
</body>
</html>
